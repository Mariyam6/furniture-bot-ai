<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIMON SAYS</title>
    <link rel="stylesheet" href="simon.css"/>
  </head>
  <body>
    <h1>Simon Says Game</h1>
    <h2>Press any key to start the game</h2>
    <div class="container">
      <div class="lineOne">
        <div class="box black" type="button"></div>
        <div class="box pink" type="button"></div>
      </div>
      <div class="lineTwo">
        <div class="box purple" type="button"></div>
        <div class="box gray" type="button"></div>
      </div>
    </div>
    </div>
    <script src="simon.js"></script>
  </body>
</html>
