<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="mystyle.css">
</head>
<body>
  <h1 class="text-center">Pricing</h1>
  <p class="text-center fw-semibold">Please checkout our most effective payment models</p>
  <div class="container mt-4">
    <div class="row g-4">
        <div class="col-12 col-md-4">
          <div class="card mx-3" style="width: 18rem;">
            <div class="card-header"> Free </div>
            <div class="card-body" >
              <h5 class="card-title fw-semibold fs-1">$0 / mo</h5>
              <p>10 users included<br>2GB of storage<br>Email support</p>
              <button type="button" class="btn btn-outline-primary">Sign up for free</button>
            </div>
          </div>
        </div>

        <div class="col-12 col-md-4">
          <div class="card mx-3" style="width: 18rem;">
            <div class="card-header"> Pro </div>
            <div class="card-body" >
              <h5 class="card-title fw-semibold fs-1">$15 / mo</h5>
              <p>20 users included<br>10GB of storage<br>Priority email support</p>
              <button type="button" class="btn btn-primary">Get started</button>
            </div>
          </div>
        </div>

        <div class="col-12 col-md-4">
            <div class="card mx-3" style="width:18rem;">
                <div class="card-header"> Enterprise </div>
                <div class="card-body">
                    <h5 class="card-title fw-semibold fs-1">$29 / mo</h5>
                    <p>30 users included<br>15GB of storage<br>Phone and email support</p>
                    <button type="button" class="btn btn-primary">Contact us</button>
                </div>
            </div>
        </div>
    </div>
        
    








    
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
